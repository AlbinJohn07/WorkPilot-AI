name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    
    # Start a PostgreSQL service container for testing
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-insecure-key
      DEBUG: "False"
      DB_NAME: "workpilot_db"
      DB_USER: "postgres"
      DB_PASSWORD: "Albin@1482"
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
    docker:
      needs: [backend, frontend]
      runs-on: ubuntu-24.04
      permissions:
        contents: read
        packages: write
      steps:
        - uses: actions/checkout@v4

        - uses: docker/setup-buildx-action@v3

        - name: Log in to GHCR
          if: github.ref == 'refs/heads/main'
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and push backend
          uses: docker/build-push-action@v6
          with:
            context: ./backend
            push: ${{ github.ref == 'refs/heads/main' }}
            tags: ghcr.io/${{ github.repository_owner }}/workpilot-backend:latest
            cache-from: type=gha
            cache-to: type=gha,mode=max

        - name: Build and push frontend
          uses: docker/build-push-action@v6
          with:
            context: ./frontend
            push: ${{ github.ref == 'refs/heads/main' }}
            build-args: |
              VITE_API_URL=${{ vars.VITE_API_URL }}
            tags: ghcr.io/${{ github.repository_owner }}/workpilot-frontend:latest
            cache-from: type=gha
            cache-to: type=gha,mode=max